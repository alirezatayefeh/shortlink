spring.application.name=shortlink

# Defaults are for the local development database in compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shortlink}
spring.datasource.username=${DB_USERNAME:shortlink}
spring.datasource.password=${DB_PASSWORD:shortlink_dev}

# Flyway owns schema changes; Hibernate only checks entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
